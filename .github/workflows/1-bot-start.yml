name: Bot de Vagas FIESC & IEL

on:
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch: 


jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Executar o Bot

        env:
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python src/bot.py

      - name: Salvar histórico de vagas (Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona apenas os arquivos JSON da pasta src
          git add src/*.json
          
          # Checa se houve alguma mudança nos arquivos. Se sim, faz o commit e envia (push)
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: atualiza histórico de vagas [skip ci]"
          git push